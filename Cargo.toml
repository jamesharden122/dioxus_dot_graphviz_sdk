[package]
name = "dioxus_dot_graphviz_sdk"
version = "0.1.0"
edition = "2021"
description = "Dioxus SDK components for DOT/Graphviz-style graph canvases."

[dependencies]
dioxus = { version = "0.7.9" }
geo = { version = "0.33.1", features = ["serde"] }
petgraph = "0.8.3"
rayon = { version = "1.12", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
